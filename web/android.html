<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>関桜会収支 Android版ダウンロード</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 24px; line-height: 1.7; color: #222; }
    h1 { font-size: 20px; }
    .btn { display: block; text-align: center; background: #1E88E5; color: #fff;
           text-decoration: none; padding: 16px; border-radius: 8px; font-size: 18px; margin: 20px 0; }
    .note { font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h1>関桜会収支 Android版</h1>
  <p>下のボタンでダウンロードします。Chromeで開きます。</p>
  <a class="btn" id="dl" href="https://github.com/ichise38-svg/receipt-report/releases/download/android-latest/receipt-report.apk">APKをダウンロード</a>
  <p class="note">
    インストールするファイルは上の青いボタンの <b>receipt-report.apk</b> です（約62MB）。<br>
    ダウンロード後、ファイルを開いてインストールしてください。<br>
    「この提供元のアプリを許可」と出たら、Chromeを許可してください。
  </p>
  <p class="note">
    インストールの手順説明は、PDFの「インストール手順」をご覧ください（PDFはインストールファイルではありません）。<br>
    <a class="note" href="downloads/android_install_guide.pdf">インストール手順（PDF）を開く</a>
  </p>
  <script>
    // LINEなどアプリ内ブラウザで開かれた場合は、Chromeで開き直す
    (function () {
      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isChrome = /Chrome\//.test(ua) && !/; wv\)/.test(ua);
      if (isAndroid && !isChrome) {
        var path = location.href.replace(/^https?:\/\//, '');
        location.href = 'intent://' + path + '#Intent;scheme=https;package=com.android.chrome;end';
      }
    })();
  </script>
</body>
</html>
