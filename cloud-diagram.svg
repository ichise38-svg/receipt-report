<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e88e5"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#90a4ae"/>
    </marker>
  </defs>

  <!-- タイトル -->
  <rect width="1200" height="1000" fill="#f5f7fa"/>
  <text x="600" y="58" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a237e">関桜会収支：端末・Google・OneDrive の関係</text>
  <text x="600" y="92" text-anchor="middle" font-size="20" fill="#455a64">データの正本は端末。Googleが会員どうしの同期を中継。OneDriveはExcelの保存先として選ぶだけ。</text>

  <!-- 会員の端末（左） -->
  <g>
    <rect x="60" y="150" width="300" height="360" rx="28" fill="#ffffff" stroke="#1e88e5" stroke-width="4"/>
    <text x="210" y="195" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e88e5">会員の端末（スマホ）</text>
    <!-- スマホの絵 -->
    <rect x="125" y="220" width="170" height="210" rx="16" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3"/>
    <rect x="140" y="240" width="140" height="22" rx="4" fill="#90caf9"/>
    <rect x="140" y="275" width="140" height="40" rx="6" fill="#bbdefb"/>
    <text x="210" y="300" text-anchor="middle" font-size="16" fill="#0d47a1">差引残高 ¥263,465</text>
    <rect x="140" y="325" width="64" height="42" rx="6" fill="#c8e6c9"/>
    <text x="172" y="352" text-anchor="middle" font-size="14" fill="#1b5e20">収入</text>
    <rect x="216" y="325" width="64" height="42" rx="6" fill="#ffcdd2"/>
    <text x="248" y="352" text-anchor="middle" font-size="14" fill="#b71c1c">支出</text>
    <rect x="140" y="378" width="140" height="22" rx="6" fill="#e1f5fe"/>
    <text x="210" y="394" text-anchor="middle" font-size="13" fill="#0d47a1">レシート写真は端末内</text>
    <text x="210" y="545" text-anchor="middle" font-size="17" fill="#263238">入力・保存は、まず端末に</text>
    <text x="210" y="570" text-anchor="middle" font-size="17" fill="#263238">オフラインでも使える</text>
    <text x="210" y="596" text-anchor="middle" font-size="15" fill="#607d8b">名簿の写真は端末だけ</text>
  </g>

  <!-- Google（中央） -->
  <g>
    <rect x="450" y="150" width="300" height="360" rx="28" fill="#ffffff" stroke="#34a853" stroke-width="4"/>
    <text x="600" y="195" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e7e34">Google（無料）</text>
    <!-- Apps Script の箱 -->
    <rect x="490" y="220" width="220" height="90" rx="14" fill="#e8f5e9" stroke="#34a853" stroke-width="2"/>
    <text x="600" y="256" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b5e20">Apps Script</text>
    <text x="600" y="284" text-anchor="middle" font-size="15" fill="#33691e">同期の中継（どの端末も同じURL）</text>
    <!-- スプレッドシート -->
    <rect x="490" y="330" width="220" height="60" rx="10" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
    <text x="600" y="358" text-anchor="middle" font-size="17" fill="#33691e">年別スプレッドシート</text>
    <text x="600" y="380" text-anchor="middle" font-size="14" fill="#558b2f">「関桜会収支 2026」など（自動作成）</text>
    <!-- 画像フォルダ -->
    <rect x="490" y="405" width="220" height="60" rx="10" fill="#f1f8e9" stroke="#7cb342" stroke-width="2"/>
    <text x="600" y="433" text-anchor="middle" font-size="17" fill="#33691e">レシート画像フォルダ</text>
    <text x="600" y="455" text-anchor="middle" font-size="14" fill="#558b2f">Googleドライブ内</text>
  </g>

  <!-- OneDrive（右） -->
  <g>
    <rect x="840" y="150" width="300" height="360" rx="28" fill="#ffffff" stroke="#0078d4" stroke-width="4" stroke-dasharray="12 8"/>
    <text x="990" y="195" text-anchor="middle" font-size="24" font-weight="bold" fill="#005a9e">OneDrive（任意）</text>
    <!-- 雲の絵 -->
    <ellipse cx="990" cy="300" rx="110" ry="50" fill="#e3f2fd" stroke="#0078d4" stroke-width="3"/>
    <ellipse cx="930" cy="290" rx="50" ry="40" fill="#e3f2fd" stroke="#0078d4" stroke-width="3"/>
    <ellipse cx="1050" cy="290" rx="50" ry="40" fill="#e3f2fd" stroke="#0078d4" stroke-width="3"/>
    <text x="990" y="305" text-anchor="middle" font-size="18" fill="#005a9e">保存先フォルダ</text>
    <text x="990" y="390" text-anchor="middle" font-size="17" fill="#263238">Excelを保存するときに</text>
    <text x="990" y="414" text-anchor="middle" font-size="17" fill="#263238">「保存先」として選ぶだけ</text>
    <text x="990" y="450" text-anchor="middle" font-size="15" fill="#607d8b">同期の仕組みには入らない</text>
  </g>

  <!-- 矢印：端末 ⇄ Google（同期） -->
  <line x1="365" y1="300" x2="445" y2="300" stroke="#1e88e5" stroke-width="5" marker-end="url(#arrowBlue)" marker-start="url(#arrowBlue)"/>
  <text x="405" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">同期</text>
  <text x="405" y="330" text-anchor="middle" font-size="14" fill="#455a64">変更分だけ送受信</text>

  <!-- 矢印：Google 内部（スプレッドシート・画像フォルダ） -->
  <line x1="600" y1="315" x2="600" y2="325" stroke="#7cb342" stroke-width="2"/>

  <!-- 矢印：OneDrive への書き出し（Excel） -->
  <line x1="365" y1="520" x2="835" y2="520" stroke="#90a4ae" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowGray)"/>
  <text x="600" y="505" text-anchor="middle" font-size="16" fill="#455a64">Excel を保存（保存先を選ぶ）</text>
  <text x="600" y="548" text-anchor="middle" font-size="14" fill="#607d8b">端末からOneDriveフォルダへ。OneDriveからの自動同期はなし</text>

  <!-- 手順の流れ -->
  <rect x="60" y="600" width="1080" height="330" rx="20" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
  <text x="600" y="645" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">データの流れ（3つのステップ）</text>

  <g>
    <circle cx="170" cy="720" r="34" fill="#1e88e5"/>
    <text x="170" y="732" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">1</text>
    <text x="170" y="790" text-anchor="middle" font-size="18" font-weight="bold" fill="#0d47a1">入力</text>
    <text x="170" y="815" text-anchor="middle" font-size="15" fill="#37474f">端末に保存</text>
    <text x="170" y="838" text-anchor="middle" font-size="15" fill="#37474f">（すぐ使える）</text>
  </g>
  <line x1="230" y1="720" x2="345" y2="720" stroke="#455a64" stroke-width="4" marker-end="url(#arrow)"/>

  <g>
    <circle cx="410" cy="720" r="34" fill="#34a853"/>
    <text x="410" y="732" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">2</text>
    <text x="410" y="790" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e7e34">同期</text>
    <text x="410" y="815" text-anchor="middle" font-size="15" fill="#37474f">Googleに送る</text>
    <text x="410" y="838" text-anchor="middle" font-size="15" fill="#37474f">他の端末が受け取る</text>
  </g>
  <line x1="470" y1="720" x2="585" y2="720" stroke="#455a64" stroke-width="4" marker-end="url(#arrow)"/>

  <g>
    <circle cx="650" cy="720" r="34" fill="#fb8c00"/>
    <text x="650" y="732" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">3</text>
    <text x="650" y="790" text-anchor="middle" font-size="18" font-weight="bold" fill="#e65100">書き出し</text>
    <text x="650" y="815" text-anchor="middle" font-size="15" fill="#37474f">Excel・PDFを作る</text>
    <text x="650" y="838" text-anchor="middle" font-size="15" fill="#37474f">保存先（OneDriveなど）を選ぶ</text>
  </g>
  <line x1="710" y1="720" x2="825" y2="720" stroke="#455a64" stroke-width="4" marker-end="url(#arrow)"/>

  <g>
    <circle cx="890" cy="720" r="34" fill="#8e24aa"/>
    <text x="890" y="732" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">4</text>
    <text x="890" y="790" text-anchor="middle" font-size="18" font-weight="bold" fill="#6a1b9a">共有</text>
    <text x="890" y="815" text-anchor="middle" font-size="15" fill="#37474f">iPhoneはホーム画面から</text>
    <text x="890" y="838" text-anchor="middle" font-size="15" fill="#37474f">Androidは直接インストール</text>
  </g>

  <text x="600" y="890" text-anchor="middle" font-size="16" fill="#455a64">ポイント：同期にOneDriveは使わない。OneDriveは「Excelを置く場所」として端末の保存画面から選ぶだけ。</text>
  <text x="600" y="925" text-anchor="middle" font-size="15" fill="#607d8b">関桜会の会員は、設定を入力しなくても同期できます（同期先URLは組み込み済み）。</text>
  <text x="600" y="960" text-anchor="middle" font-size="14" fill="#90a4ae">作成: 2026年（Receipt Report 1.0.3）</text>
</svg>
